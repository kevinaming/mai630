<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>MAI 630 Speaking Practice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Archivo:wght@600;800&display=swap">
<style>
/* Layout: a sticky navigation bar, then one view at a time (home → section → topic), big touch targets for a tablet. */
:root {
  --bg: #F3F4F7; --surface: #FFFFFF; --ink: #121A2B; --muted: #5B6476;
  --navy: #0C1422; --red: #C0122A; --line: #DCE0E8; --chip: #E9ECF3; --es: #3D4A63;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", Verdana, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B111C; --surface: #141C2B; --ink: #EEF1F6; --muted: #9AA4B6;
  --navy: #22324F; --red: #FF5A6E; --line: #273249; --chip: #1D2738; --es: #B9C3D6; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0B111C; --surface: #141C2B; --ink: #EEF1F6; --muted: #9AA4B6;
  --navy: #22324F; --red: #FF5A6E; --line: #273249; --chip: #1D2738; --es: #B9C3D6; color-scheme: dark }

* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.45 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--navy) }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible, select:focus-visible { outline: 3px solid var(--red); outline-offset: 2px }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--navy); color: #fff;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.bar-row { max-width: 980px; margin: 0 auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.navbtn { background: rgba(255,255,255,.12); border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 700; color: #fff; min-height: 46px }
.navbtn:hover { background: rgba(255,255,255,.22) }
.crumb { flex: 1; min-width: 0; font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: .02em; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.opts { max-width: 980px; margin: 8px auto 0; display: flex; gap: 8px; flex-wrap: wrap }
.toggle { background: transparent; border: 1.5px solid rgba(255,255,255,.35); color: #fff; border-radius: 999px; padding: 6px 14px; font-size: 14px; min-height: 38px }
.toggle[aria-pressed="true"] { background: #fff; color: #0C1422; border-color: #fff; font-weight: 700 }
.speed { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.35); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; min-height: 38px }
.speed option { color: #121A2B }

main { max-width: 980px; margin: 0 auto; padding-block: 22px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(26px, 4vw, 36px); line-height: 1.1; margin: 4px 0 6px; text-wrap: balance }
.lead { color: var(--muted); margin: 0 0 20px; max-width: 62ch }
.eyebrow { font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--red) }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px }
.tile { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 18px; min-height: 108px;
  display: flex; flex-direction: column; gap: 6px; justify-content: space-between; transition: transform .12s, border-color .12s }
.tile:hover:not(:disabled) { border-color: var(--red); transform: translateY(-2px) }
.tile:disabled { opacity: .5; cursor: default }
.tile .t { font-family: var(--display); font-weight: 800; font-size: 21px; line-height: 1.15 }
.tile .s { color: var(--muted); font-size: 15px }
.tile .n { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums }
.tag { align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--chip); color: var(--muted); padding: 3px 9px; border-radius: 999px }
.tile.big { min-height: 150px; border-width: 2px }
.tile.big .t { font-size: 26px }

.cards { display: grid; gap: 14px }
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 10px; min-width: 0 }
.ask { background: var(--chip); border-radius: 10px; padding: 10px 12px }
.ask .lbl, .ans-lbl { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.ask .q { font-weight: 700; font-size: 18px }
.ask .qes { color: var(--es); font-size: 15px }
.en { font-size: 22px; line-height: 1.4; font-weight: 700 }
.es { color: var(--es); font-size: 16px; border-left: 3px solid var(--red); padding-left: 10px }
.pron { font-size: 15px; color: var(--muted) }
.pron b { color: var(--ink) }
.actions { display: flex; gap: 8px; flex-wrap: wrap }
.act { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: 15px; min-height: 44px }
.act:hover { border-color: var(--red) }
.act.play { background: var(--navy); color: #fff; border-color: var(--navy) }
.hidden-en { filter: blur(7px); user-select: none; cursor: pointer }
.reveal-hint { font-size: 13px; color: var(--muted) }
.next { margin-top: 22px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap }
.next .act { font-size: 16px; padding: 12px 18px }
.swipe-hint { position: fixed; top: 50%; left: calc(8px + env(safe-area-inset-left, 0px)); transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%;
  background: var(--navy); color: #fff; font-size: 28px; font-weight: 700; display: grid; place-items: center; opacity: 0; pointer-events: none; z-index: 20 }
.note { margin-top: 26px; color: var(--muted); font-size: 14px }
@media (prefers-reduced-motion: reduce) { .tile { transition: none } .tile:hover:not(:disabled) { transform: none } }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-row">
    <button class="navbtn" id="back" type="button">‹ Atrás</button>
    <div class="crumb" id="crumb">Inicio</div>
    <button class="navbtn" id="home" type="button">Inicio</button>
  </div>
  <div class="opts">
    <button class="toggle" id="optEs" type="button" aria-pressed="true">Español</button>
    <button class="toggle" id="optPractice" type="button" aria-pressed="false">Modo práctica</button>
    <button class="toggle" id="optPron" type="button" aria-pressed="true">Pronunciación</button>
    <select class="speed" id="speed" aria-label="Velocidad de la voz">
      <option value="0.7">Voz lenta</option>
      <option value="0.85" selected>Voz normal</option>
      <option value="1">Voz rápida</option>
    </select>
  </div>
</header>
<main id="view"></main>
<div class="swipe-hint" id="swipeHint" aria-hidden="true">‹</div>

<script src="data.js"></script>
<script>
(() => {
  const S = window.SECTIONS || [];
  const view = document.getElementById("view");
  const crumb = document.getElementById("crumb");
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v) } catch (e) { return d } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} }
  };
  const opts = { es: store.get("es", true), practice: store.get("practice", false), pron: store.get("pron", true), speed: store.get("speed", "0.85") };
  let stack = [];  // navigation history: [{v:'home'}, {v:'section', s}, {v:'topic', s, t}]
  const tts = "speechSynthesis" in window;

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pronHtml = p => esc(p).replace(/([^·(]+)\(([^)]+)\)/g, (m, w, r) => `<b>${w.trim()}</b> (${r})`);

  function voice() {
    if (!tts) return null;
    const vs = speechSynthesis.getVoices();
    return vs.find(v => v.lang === "en-US" && /Samantha|Google US|Aria|Jenny/i.test(v.name)) || vs.find(v => v.lang === "en-US") || vs.find(v => v.lang.startsWith("en")) || null;
  }
  function say(text, rate) {
    if (!tts) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = voice(); if (v) u.voice = v;
    u.lang = "en-US"; u.rate = rate || parseFloat(opts.speed);
    speechSynthesis.speak(u);
  }

  // Each view is a browser history entry, so the browser's own back gesture and button work too.
  function go(state) { stack.push(state); history.pushState({ depth: stack.length }, ""); render() }
  function back() { if (stack.length > 1) history.back() }
  window.addEventListener("popstate", e => {
    const depth = (e.state && e.state.depth) || 1;
    if (depth < stack.length) { stack.length = depth; render() }
  });

  // Swipe from the left edge to the right goes back one view.
  const hint = document.getElementById("swipeHint");
  let sw = null;
  document.addEventListener("touchstart", e => {
    const t = e.touches[0];
    sw = (e.touches.length === 1 && t.clientX < 40 && stack.length > 1) ? { x: t.clientX, y: t.clientY, dx: 0 } : null;
  }, { passive: true });
  document.addEventListener("touchmove", e => {
    if (!sw) return;
    const t = e.touches[0];
    sw.dx = t.clientX - sw.x;
    if (Math.abs(t.clientY - sw.y) > 60) { sw = null; hint.style.opacity = 0; return }
    const p = Math.max(0, Math.min(1, sw.dx / 90));
    hint.style.opacity = p; hint.style.transform = `translateY(-50%) translateX(${p * 24}px)`;
  }, { passive: true });
  document.addEventListener("touchend", () => {
    if (sw && sw.dx > 90) back();
    sw = null; hint.style.opacity = 0; hint.style.transform = "translateY(-50%)";
  });

  function renderHome() {
    crumb.textContent = "MAI 630 · Práctica para Zoom";
    const main = S.filter(s => !s.soon && s.id !== "m1" && !/^m\d/.test(s.id));
    const mods = S.filter(s => /^m\d/.test(s.id));
    view.innerHTML = `
      <div class="eyebrow">MAI 630 · Computer Vision</div>
      <h1>Práctica para la reunión de Zoom</h1>
      <p class="lead">Frases y respuestas en inglés sencillo, con su traducción y ayuda de pronunciación. Toca un tema, escucha la frase y repítela en voz alta.</p>
      <div class="grid">${main.map(tile).join("")}</div>
      <h2 class="eyebrow" style="margin:28px 0 12px">Módulos</h2>
      <div class="grid">${mods.map(tile).join("")}</div>`;
    view.querySelectorAll("[data-s]").forEach(b => b.onclick = () => go({ v: "section", s: b.dataset.s }));
  }
  function count(s) { return s.topics.reduce((a, t) => a + t.items.length, 0) }
  function tile(s) {
    return `<button class="tile big" type="button" data-s="${s.id}" ${s.soon ? "disabled" : ""}>
      <span class="tag">${esc(s.tag)}</span>
      <span class="t">${esc(s.title)}</span>
      <span class="s">${esc(s.sub)}</span>
      <span class="n">${s.soon ? "Lo preparamos después" : `${s.topics.length} temas · ${count(s)} frases`}</span></button>`;
  }

  function renderSection(sid) {
    const s = S.find(x => x.id === sid);
    crumb.textContent = s.title;
    view.innerHTML = `
      <div class="eyebrow">${esc(s.tag)}</div>
      <h1>${esc(s.title)}</h1>
      <p class="lead">${esc(s.sub)}. Elige un tema.</p>
      <div class="grid">${s.topics.map((t, i) => `
        <button class="tile" type="button" data-t="${t.id}">
          <span class="t">${esc(t.title)}</span>
          <span class="n">${t.items.length} ${t.items.length === 1 ? "frase" : "frases"}</span></button>`).join("")}</div>`;
    view.querySelectorAll("[data-t]").forEach(b => b.onclick = () => go({ v: "topic", s: sid, t: b.dataset.t }));
  }

  function renderTopic(sid, tid) {
    const s = S.find(x => x.id === sid);
    const idx = s.topics.findIndex(x => x.id === tid);
    const t = s.topics[idx];
    crumb.textContent = `${s.title} › ${t.title}`;
    view.innerHTML = `
      <div class="eyebrow">${esc(s.title)}</div>
      <h1>${esc(t.title)}</h1>
      <div class="cards">${t.items.map((it, i) => card(it, i)).join("")}</div>
      <div class="next">
        ${idx > 0 ? `<button class="act" type="button" data-jump="${s.topics[idx - 1].id}">‹ ${esc(s.topics[idx - 1].title)}</button>` : "<span></span>"}
        ${idx < s.topics.length - 1 ? `<button class="act play" type="button" data-jump="${s.topics[idx + 1].id}">${esc(s.topics[idx + 1].title)} ›</button>` : ""}
      </div>
      ${tts ? "" : `<p class="note">Este navegador no tiene voz en inglés disponible: el botón Escuchar no aparece.</p>`}`;
    view.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => { stack[stack.length - 1] = { v: "topic", s: sid, t: b.dataset.jump }; history.replaceState({ depth: stack.length }, ""); render() });
    view.querySelectorAll("[data-say]").forEach(b => b.onclick = () => { const it = t.items[+b.dataset.say]; say(b.dataset.kind === "q" ? it.q : it.en, b.dataset.rate ? parseFloat(b.dataset.rate) : null) });
    view.querySelectorAll(".hidden-en").forEach(el => el.onclick = () => { el.classList.remove("hidden-en"); const h = el.nextElementSibling; if (h && h.classList.contains("reveal-hint")) h.remove() });
  }
  function card(it, i) {
    const ask = it.q ? `<div class="ask"><div class="lbl">El estudiante pregunta</div><div class="q">${esc(it.q)}</div>${opts.es && it.qes ? `<div class="qes">${esc(it.qes)}</div>` : ""}
      ${tts ? `<div class="actions" style="margin-top:6px"><button class="act" type="button" data-say="${i}" data-kind="q">▶ Escuchar pregunta</button></div>` : ""}</div>` : "";
    const hide = opts.practice;
    return `<article class="card">
      ${ask}
      ${it.q ? `<div class="ans-lbl">Tu respuesta</div>` : ""}
      <div class="en ${hide ? "hidden-en" : ""}">${esc(it.en)}</div>
      ${hide ? `<div class="reveal-hint">Di la frase en inglés y toca el texto para comprobar.</div>` : ""}
      ${opts.pron && it.pron ? `<div class="pron">Pronunciación: ${pronHtml(it.pron)}</div>` : ""}
      ${opts.es ? `<div class="es">${esc(it.es)}</div>` : ""}
      ${tts ? `<div class="actions"><button class="act play" type="button" data-say="${i}">▶ Escuchar</button><button class="act" type="button" data-say="${i}" data-rate="0.6">Muy lento</button></div>` : ""}
    </article>`;
  }

  function render() {
    if (tts) speechSynthesis.cancel();
    const st = stack[stack.length - 1];
    document.getElementById("back").disabled = stack.length < 2;
    document.getElementById("back").style.visibility = stack.length < 2 ? "hidden" : "visible";
    if (st.v === "home") renderHome();
    else if (st.v === "section") renderSection(st.s);
    else renderTopic(st.s, st.t);
    window.scrollTo(0, 0);
  }

  function bindToggle(id, key) {
    const b = document.getElementById(id);
    b.setAttribute("aria-pressed", String(opts[key]));
    b.onclick = () => { opts[key] = !opts[key]; store.set(key, opts[key]); b.setAttribute("aria-pressed", String(opts[key])); render() };
  }
  bindToggle("optEs", "es"); bindToggle("optPractice", "practice"); bindToggle("optPron", "pron");
  const sp = document.getElementById("speed"); sp.value = opts.speed;
  sp.onchange = () => { opts.speed = sp.value; store.set("speed", sp.value) };
  document.getElementById("back").onclick = back;
  document.getElementById("home").onclick = () => { if (stack.length > 1) history.go(1 - stack.length) };
  if (tts) speechSynthesis.onvoiceschanged = () => {};

  // Optional deep link: #m1 or #m1-canny
  stack = [{ v: "home" }];
  const h = (location.hash || "").slice(1);
  history.replaceState({ depth: 1 }, "", location.pathname);
  if (h) {
    const [sid, tid] = h.split("-");
    const s = S.find(x => x.id === sid && !x.soon);
    if (s) {
      stack.push({ v: "section", s: sid }); history.pushState({ depth: 2 }, "");
      if (tid && s.topics.some(t => t.id === tid)) { stack.push({ v: "topic", s: sid, t: tid }); history.pushState({ depth: 3 }, "") }
    }
  }
  render();
})();
</script>
</body>
</html>
